version: '3'
services:
  frontend:
    image: todo-app-ci-cd-kta24-frontend
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://backend:3000
    networks:
      - todo-network

  backend:
    image: todo-app-ci-cd-kta24-backend
    ports:
      - "3000:3000"
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
